name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    test:
        name: Test
        runs-on: ${{ matrix.os }}
        permissions:
            contents: read
            id-token: write
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, windows-latest]
                node-version: [22, 24]

        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Setup pnpm
              uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

            - name: Setup Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: 'pnpm'

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Type check
              run: pnpm run type-check

            - name: Lint
              run: pnpm run lint

            - name: Format check
              run: pnpm run format:check

            - name: Test (with coverage)
              run: pnpm run test:coverage

            - name: Upload coverage to Codecov
              if: matrix.os == 'ubuntu-latest' && matrix.node-version == 24
              uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
              with:
                  use_oidc: true
                  disable_search: true
                  files: ./coverage/lcov.info
                  fail_ci_if_error: false

    build:
        name: Build
        runs-on: ubuntu-latest
        needs: test

        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Setup pnpm
              uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

            - name: Setup Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 24
                  cache: 'pnpm'

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Build
              run: pnpm run build

            - name: Public API check
              run: pnpm run check:api

            - name: Size limit
              run: pnpm run size

            - name: Upload build artifacts
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: dist
                  path: dist
                  retention-days: 7

    smoke:
        name: Smoke (pack + resolve exports)
        runs-on: ubuntu-latest
        needs: test

        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Setup pnpm
              uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

            - name: Setup Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 24
                  cache: 'pnpm'

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Build
              run: pnpm run build

            - name: Pack the tarball
              run: pnpm pack --pack-destination "$RUNNER_TEMP"

            - name: Install the tarball into a bare consumer
              working-directory: ${{ runner.temp }}
              run: |
                  mkdir -p consumer && cd consumer
                  npm init -y > /dev/null
                  npm pkg set type=module
                  npm install "$RUNNER_TEMP"/zerosumstudio-conduit-*.tgz react

            - name: Import every export, ESM and CJS
              working-directory: ${{ runner.temp }}/consumer
              run: |
                  node --input-type=module -e '
                    const { createClient, defaults } = await import("@zerosumstudio/conduit")
                    await import("@zerosumstudio/conduit/react")
                    await import("@zerosumstudio/conduit/devtools")
                    const { createMockServer } = await import("@zerosumstudio/conduit/testing")
                    const server = createMockServer({ baseUrl: "/api" })
                    server.get("/ping", () => ({ ok: true }))
                    const api = defaults(createClient({ baseUrl: "/api", fetch: server.fetch }))
                    const body = await api.get("/ping")
                    if (body.ok !== true) throw new Error("unexpected body: " + JSON.stringify(body))
                  '
                  node -e '
                    require("@zerosumstudio/conduit")
                    require("@zerosumstudio/conduit/react")
                    require("@zerosumstudio/conduit/devtools")
                    require("@zerosumstudio/conduit/testing")
                  '

            - name: Type-check against the tarball
              working-directory: ${{ runner.temp }}/consumer
              run: |
                  npm install typescript@6 @types/react @types/node
                  cat > index.ts <<'TS'
                  import { createClient, defaults, type ConduitError } from '@zerosumstudio/conduit'
                  import { createHooks } from '@zerosumstudio/conduit/react'
                  import { attachDevtools } from '@zerosumstudio/conduit/devtools'
                  import { createMockServer } from '@zerosumstudio/conduit/testing'

                  const api = defaults(createClient({ baseUrl: '/api' }))
                  const hooks = createHooks(api)
                  const devtools = attachDevtools(api)
                  const server = createMockServer({ baseUrl: '/api' })

                  export type Exports = [typeof hooks.useRequest, typeof devtools.store, typeof server.calls, ConduitError]
                  TS
                  npx tsc --noEmit --strict --module nodenext --moduleResolution nodenext --target es2022 --jsx react-jsx index.ts

            - name: Type-check the CommonJS types against the tarball
              working-directory: ${{ runner.temp }}/consumer
              run: |
                  cat > index.cts <<'TS'
                  import conduit = require('@zerosumstudio/conduit')
                  import react = require('@zerosumstudio/conduit/react')
                  import devtools = require('@zerosumstudio/conduit/devtools')
                  import testing = require('@zerosumstudio/conduit/testing')

                  export type Exports = [
                      typeof conduit.createClient,
                      typeof react.createHooks,
                      typeof devtools.attachDevtools,
                      typeof testing.createMockServer,
                  ]
                  TS
                  npx tsc --noEmit --strict --module nodenext --moduleResolution nodenext --target es2022 --jsx react-jsx index.cts
